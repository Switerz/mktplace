[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mktplace-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Teto em 2.1 por CAUSA MEDIDA, nao por precaucao (INCIDENTE-API-DB-4C).
    #
    # O SQLAlchemy 2.1.0 trocou o DBAPI padrao de `postgresql://` de `psycopg2`
    # para `psycopg` (v3). O Render constroi com `pip install -e .`, que ignora
    # o `uv.lock` e reresolve as faixas: um deploy pegou 2.1.0 com apenas
    # `psycopg2` instalado, `create_engine` levantou `ModuleNotFoundError:
    # psycopg`, o engine nunca nasceu e TODAS as rotas com banco viraram 503.
    #
    # Reproduzido com DSN sintetico:
    #   2.0.43 + psycopg2                 -> OK  (driver psycopg2)
    #   2.1.0  + psycopg2                 -> ModuleNotFoundError 'psycopg'
    #   2.1.0  + psycopg2, `+psycopg2://` -> OK  (driver psycopg2)
    #   2.1.0  + psycopg v3               -> OK  (driver psycopg)
    #
    # O teto preserva o driver ATUAL e nao mexe na `DATABASE_URL`. Subir para
    # 2.1 exige decidir o DBAPI de propriedade e e' outro trabalho.
    #
    # Isto NAO torna o build reproduzivel: as demais faixas `>=` continuam
    # sendo reresolvidas a cada deploy. Divida registrada em
    # `docs/incidente_api_db_sqlalchemy_21.md`.
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pandas>=3.0.3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

# INCIDENTE 2026-09-25/28 — POR QUE `include` NAO E' OPCIONAL
# ============================================================
# Sem ele, `where = ["."]` varria o diretorio inteiro e a wheel publicava CINCO
# pacotes de topo: `alembic`, `app`, `etl`, `tests` e `tools`.
#
# `alembic/` aqui e' a pasta de MIGRATIONS, com um `__init__.py` de 0 bytes. Ao
# instalar `mktplace-api` na imagem do Airflow, o pip gravou esse arquivo POR
# CIMA do `alembic/__init__.py` do pacote real — `--no-deps` protege contra
# resolver dependencia, e NAO contra colisao de arquivo entre distribuicoes.
# Resultado medido no staging, de 25/09 22:14 a 28/09: todo servico morria no
# boot com `ImportError: cannot import name '__version__' from 'alembic'`, e o
# build passava VERDE — porque nada no build importava `alembic`.
#
# `tests` e `tools` sao piores em outro sentido: sao nomes que qualquer projeto
# pode ter. Publicar um pacote de topo chamado `tests` a partir desta
# distribuicao e' apontar uma arma para o ambiente de quem a instalar.
#
# A allowlist e' por INCLUSAO: diretorio novo em `apps/api/` fica de fora por
# omissao, nao por alguem lembrar de acrescenta-lo a um `exclude`. O mesmo
# criterio do `pyproject.toml` da raiz, que empacota `pipelines.expedicao`.
#
# ⚠️ O conteudo REAL da wheel — nao esta declaracao — e' verificado em
# `apps/api/tests/test_wheel_packaging.py`, que constroi a distribuicao e le'
# o `top_level.txt` e o `RECORD` de dentro do `.whl`.
[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

